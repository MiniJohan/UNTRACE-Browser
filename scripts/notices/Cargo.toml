# Generates app/src-tauri/THIRD-PARTY-NOTICES.txt: the licences of everything compiled into
# untrace.exe (Rust crates for Windows, normal dependencies only) and bundled into its UI (npm
# production dependencies). Release tooling only; not part of the product workspace.
#
#   cargo run --manifest-path scripts/notices/Cargo.toml            # write the file
#   cargo run --manifest-path scripts/notices/Cargo.toml -- --check # fail if it is out of date
[package]
name = "untrace-notices"
version = "0.0.0"
edition = "2024"
publish = false
license = "MPL-2.0"

[dependencies]
serde_json = "1.0.154"

[workspace]
members = ["."]
