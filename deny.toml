# cargo-deny policy (D-020). Run: cargo deny check
[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
# Any RustSec advisory fails the check unless it is listed here with a reason.
ignore = []

[licenses]
# Permissive licences plus MPL-2.0 (adblock-rust, M3). UNTRACE's own licence is open (D-017).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates refer to each other by path (publish = false): not a wildcard
# dependency on a registry (M8 dependency review).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
