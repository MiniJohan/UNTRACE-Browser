[package]
name = "untrace-spike-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
adblock = "0.13.6"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.154"
# M5 probe: the real network layer.
untrace-net = { path = "../../crates/untrace-net" }
# M6 probe: the real cosmetic rules.
untrace-filter = { path = "../../crates/untrace-filter" }
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_Shell", "Win32_NetworkManagement_Dns", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Memory", "Win32_Security"] }

