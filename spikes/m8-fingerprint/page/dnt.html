<!doctype html>
<meta charset="utf-8">
<title>dnt</title>
<script>
// When does the engine start sending "DNT: 1", and does navigator.doNotTrack follow?
(async function () {
  const run = new URLSearchParams(location.search).get('run') || 'unnamed';
  const R = { run: run, samples: [] };
  const t0 = performance.now();
  for (let i = 0; i < 50; i++) {
    R.samples.push({ i: i, ms: Math.round(performance.now() - t0), js: String(navigator.doNotTrack) });
    try { await fetch('/fp/echo?ctx=t' + i, { cache: 'no-store' }); } catch (e) {}
    await new Promise(r => setTimeout(r, 500));
  }
  window.__fp = R;
  try { await fetch('/fp/result?run=' + encodeURIComponent(run), { method: 'POST', body: JSON.stringify(R) }); } catch (e) {}
  document.title = 'fp-done';
})();
</script>
